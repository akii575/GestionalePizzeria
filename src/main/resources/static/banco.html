<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="theme-color" content="#1A5EA9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <title>Banco</title>
    <style>html.auth-loading body{visibility:hidden}</style>
    <script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/gestionale.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body data-service-type="banco">
<main class="dashboard">
    <header class="dashboard-header">
        <div><h1>Banco</h1></div>
        <nav><a href="/">Home</a><a href="/ordini.html">Nuova comanda</a><a href="/gestionale.html">Tutti gli ordini</a><a href="/consegne.html">Consegne</a><a href="/ritiri.html">Ritiri</a><a href="/tavoli.html">Tavoli</a><button id="aggiorna" type="button">Aggiorna</button><button id="reset-numeri" type="button" class="pericolo" hidden>Reset ordini</button></nav>
    </header>
    <section class="filtri" aria-label="Filtri ordini banco">
        <label for="filtro">Cerca ordine<input id="filtro" type="search" placeholder="Prodotto..."></label>
        <label for="data">Data<input id="data" type="date"></label>
        <label class="switch"><input id="autoAggiorna" type="checkbox" checked> Aggiorna ogni 15 secondi</label>
    </section>
    <section class="metriche" aria-label="Riepilogo banco">
        <div><span>Ordini visualizzati</span><strong id="numero-ordini">0</strong></div>
        <div data-hide-for-staff><span>Totale visualizzato</span><strong id="totale-ordini">0,00 EUR</strong></div>
        <div><span>Ultimo aggiornamento</span><strong id="ultimo-aggiornamento">--:--</strong></div>
    </section>
    <p id="stato" role="status"></p>
    <section id="lista-ordini" class="lista-ordini" aria-live="polite"></section>
</main>
<script src="/pagamento-ui.js"></script>
<script src="/order-card.js"></script>
<script src="/gestionale.js"></script>
<script src="/theme.js"></script>
<script src="/nav.js"></script>
</body>
</html>
