<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CIVICO7</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="theme-color" content="#1A5EA9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <link rel="stylesheet" href="/home.css">
    <style>html.auth-loading body{visibility:hidden}</style>
    <script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body>
<main class="home">
    <h1>CIVICO7</h1>
    <div class="home-actions">
        <a class="home-new-order" href="/ordini.html">
            <span aria-hidden="true">+</span>
            <strong>Nuova comanda</strong>
        </a>
    </div>
    <section class="serata-grid" aria-label="Riepilogo della serata">
        <a class="serata-tile" id="riepilogo-tavoli" href="/tavoli.html">
            <strong class="serata-value" id="tavoli-value">—</strong>
            <span class="serata-label" id="tavoli-label">Tavoli · — coperti</span>
        </a>
        <a class="serata-tile" id="riepilogo-consegne" href="/consegne.html">
            <strong class="serata-value" id="consegne-value">—</strong>
            <span class="serata-label" id="consegne-label">Consegne da fare · — in giro</span>
        </a>
        <a class="serata-tile" id="riepilogo-ritiri" href="/ritiri.html">
            <strong class="serata-value" id="ritiri-value">—</strong>
            <span class="serata-label" id="ritiri-label">Ritiri</span>
        </a>
        <a class="serata-tile" id="riepilogo-banco" href="/banco.html">
            <strong class="serata-value" id="banco-value">—</strong>
            <span class="serata-label" id="banco-label">Banco</span>
        </a>
        <a class="serata-tile" id="riepilogo-incasso" href="/gestionale.html">
            <strong class="serata-value" id="incasso-value">—</strong>
            <span class="serata-label" id="incasso-label">Incasso · — ordini</span>
        </a>
    </section>
    <section class="printer-panel" aria-labelledby="printer-title">
        <div class="printer-content">
            <h2 id="printer-title">Stampa</h2>
            <p id="printer-status" class="printer-status" role="status" aria-live="polite">Caricamento stato stampa...</p>
            <p id="printer-queue" class="printer-queue" aria-live="polite"></p>
            <p id="printer-warning" class="printer-warning" hidden></p>
            <p id="printer-agent-status" class="printer-agent-status" hidden></p>
            <ul id="printer-list" class="printer-list" hidden></ul>
        </div>
        <button id="printer-retry" type="button" hidden>Riprova comande</button>
    </section>
</main>
<script src="/printer-status.js" defer></script>
<script src="/theme.js"></script>
<script src="/nav.js"></script>
</body>
</html>
