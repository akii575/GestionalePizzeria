<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="theme-color" content="#1A5EA9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <title>Ritiri al banco</title>
    <style>html.auth-loading body{visibility:hidden}</style><script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/gestionale.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body data-service-type="ritiro">
<main class="dashboard">
    <header class="dashboard-header">
        <div><h1>Ritiri al banco</h1></div>
        <nav><a href="/">Home</a><a href="/ordini.html">Nuova comanda</a><a href="/gestionale.html">Tutti gli ordini</a><a href="/consegne.html">Consegne</a><a href="/tavoli.html">Tavoli</a><a href="/banco.html">Banco</a><button id="aggiorna" type="button">Aggiorna</button><button id="reset-numeri" type="button" class="pericolo" hidden>Reset ordini</button></nav>
    </header>
    <section class="filtri" aria-label="Filtri ritiri">
        <label for="filtro"><span class="filtri__etichetta">Cerca cliente</span><input id="filtro" type="search" aria-label="Cerca cliente" placeholder="Nome cliente..."></label>
        <div class="filtro-data">
            <input id="data" class="filtro-data__input" type="date" aria-label="Data ordini">
            <span id="apri-data" class="filtro-data__button" aria-hidden="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 3v4M17 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 14h2m3 0h2m3 0h1M7 18h2m3 0h2" stroke="currentColor" stroke-width="2"/></svg>
                <span data-date-label>Oggi</span>
            </span>
        </div>
    </section>
    <section class="metriche" aria-label="Riepilogo ritiri">
        <span class="metriche__conteggio" aria-label="Ritiri visualizzati"><strong id="numero-ordini">0</strong><span id="etichetta-ordini">ritiri</span></span>
        <span class="metriche__totale" data-hide-for-staff aria-label="Totale visualizzato"><span aria-hidden="true">· </span><strong id="totale-ordini">0,00 €</strong></span>
        <span class="metriche__aggiornamento"><span aria-hidden="true">· agg. </span><strong id="ultimo-aggiornamento" aria-label="Ultimo aggiornamento">--:--</strong></span>
    </section>
    <p id="stato" role="status"></p>
    <section id="lista-ordini" class="lista-ordini" aria-live="polite"></section>
</main>
<script src="/pagamento-ui.js"></script>
<script src="/html-utils.js"></script>
<script src="/order-card.js"></script>
<script src="/gestionale.js"></script>
<script src="/theme.js"></script>
<script src="/nav.js"></script>
</body>
</html>
