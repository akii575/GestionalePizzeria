<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="theme-color" content="#1A5EA9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <title>Consegne</title>
    <style>html.auth-loading body{visibility:hidden}</style>
    <script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/gestionale.css">
    <link rel="stylesheet" href="/consegne.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body>
<main class="dashboard">
    <header class="dashboard-header">
        <div><h1>Consegne</h1></div>
        <nav>
            <a href="/" data-admin-only hidden>Home</a>
            <a href="/ordini.html" data-admin-only hidden>Nuova comanda</a>
            <a href="/gestionale.html" data-admin-only hidden>Tutti gli ordini</a>
            <a href="/ritiri.html" data-admin-only hidden>Ritiri</a>
            <a href="/banco.html" data-admin-only hidden>Banco</a>
            <a href="/tavoli.html" data-admin-only hidden>Tavoli</a>
            <button id="aggiorna" type="button">Aggiorna</button>
        </nav>
    </header>
    <section class="filtri" aria-label="Filtri consegne">
        <label for="filtro">Cerca indirizzo o telefono<input id="filtro" type="search" placeholder="Via o numero..."></label>
        <label for="data">Data ordine<input id="data" type="date"></label>
    </section>
    <section class="metriche" aria-label="Riepilogo consegne">
        <div><span>Consegne visualizzate</span><strong id="numero-consegne">0</strong></div>
        <div><span>Totale consegne</span><strong id="totale-consegne">0,00 EUR</strong></div>
        <div><span>Ultimo aggiornamento</span><strong id="ultimo-aggiornamento">--:--</strong></div>
    </section>
    <p id="stato" role="status" aria-live="polite"></p>
    <section id="lista-consegne" class="lista-consegne" aria-live="polite"></section>
</main>
<script src="/maps-ui.js"></script>
<script src="/pagamento-ui.js"></script>
<script src="/order-card.js"></script>
<script src="/consegne.js"></script>
<script src="/theme.js"></script>
<script src="/nav.js"></script>
</body>
</html>
