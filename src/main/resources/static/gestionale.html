<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <meta name="theme-color" content="#1A5EA9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <title>Tutti gli ordini</title>
    <style>html.auth-loading body{visibility:hidden}</style><script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/gestionale.css">
    <link rel="stylesheet" href="/theme.css">
    <link rel="stylesheet" href="/nav.css">
</head>
<body>
<main class="dashboard">
    <header class="dashboard-header">
        <div><h1>Tutti gli ordini</h1></div>
        <nav><a href="/">Home</a><a href="/ordini.html">Nuova comanda</a><a href="/consegne.html">Consegne</a><a href="/ritiri.html">Ritiri</a><a href="/banco.html">Banco</a><a href="/tavoli.html">Tavoli</a><button id="aggiorna" type="button">Aggiorna</button><button id="reset-numeri" type="button" class="pericolo" hidden>Reset ordini</button></nav>
    </header>
    <section class="filtri" aria-label="Filtri ordini">
        <label for="filtro"><span class="filtri__etichetta">Cerca tavolo, cliente, recapito o prodotto</span><input id="filtro" type="search" aria-label="Cerca tavolo, cliente, recapito o prodotto" placeholder="Tavolo, indirizzo o prodotto..."></label>
        <div class="filtro-data">
            <input id="data" class="filtro-data__input" type="date" aria-label="Data ordini">
            <span id="apri-data" class="filtro-data__button" aria-hidden="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 3v4M17 3v4M3 10h18" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 14h2m3 0h2m3 0h1M7 18h2m3 0h2" stroke="currentColor" stroke-width="2"/></svg>
                <span data-date-label>Oggi</span>
            </span>
        </div>
    </section>
    <section class="metriche" aria-label="Riepilogo">
        <span class="metriche__conteggio" aria-label="Ordini visualizzati"><strong id="numero-ordini">0</strong><span id="etichetta-ordini">ordini</span></span>
        <span class="metriche__totale" data-hide-for-staff aria-label="Totale visualizzato"><span aria-hidden="true">· </span><strong id="totale-ordini">0,00 €</strong></span>
        <span class="metriche__aggiornamento"><span aria-hidden="true">· agg. </span><strong id="ultimo-aggiornamento" aria-label="Ultimo aggiornamento">--:--</strong></span>
    </section>
    <p id="stato" role="status"></p>
    <section id="lista-ordini" class="lista-ordini" aria-live="polite"></section>
</main>
<dialog id="reset-numeri-dialog" class="reset-confirm-dialog" aria-labelledby="reset-numeri-dialog-title">
    <h2 id="reset-numeri-dialog-title">Reset ordini</h2>
    <p>Verranno eliminati tutti gli ordini della giornata e i relativi job di stampa. La numerazione ripartira' da 1. L'operazione non e' reversibile.</p>
    <label for="reset-numeri-phrase">Scrivi RESET per confermare</label>
    <input id="reset-numeri-phrase" type="text" autocomplete="off" spellcheck="false">
    <div class="reset-confirm-dialog__actions">
        <button id="reset-numeri-cancel" type="button">Annulla</button>
        <button id="reset-numeri-confirm" class="pericolo" type="button" disabled>Elimina ordini</button>
    </div>
</dialog>
<script src="/maps-ui.js"></script>
<script src="/pagamento-ui.js"></script>
<script src="/order-card.js"></script>
<script src="/gestionale.js"></script>
<script src="/theme.js"></script>
<script src="/nav.js"></script>
</body>
</html>
