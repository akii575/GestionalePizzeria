<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuova comanda | CIVICO7</title>
    <style>html.auth-loading body{visibility:hidden}</style><script src="/auth-guard.js"></script>
    <link rel="stylesheet" href="/ordini.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
<main class="container">
    <header><h1>Nuova comanda</h1><nav class="navigazione"><a href="/">Home</a><a href="/gestionale.html">Tutti gli ordini</a><a href="/consegne.html">Consegne</a><a href="/ritiri.html">Ritiri</a><a href="/banco.html">Banco</a><a href="/tavoli.html">Tavoli</a></nav></header>
    <section class="tavolo-input">
        <label for="tipo-ordine">Tipo ordine</label>
        <select id="tipo-ordine">
            <option value="tavolo">Tavolo</option>
            <option value="banco">Banco</option>
            <option value="ritiro">Ritiro</option>
            <option value="consegna">Consegna</option>
        </select>
        <div id="campo-tavolo">
            <label for="tavolo">Tavolo</label>
            <select id="tavolo">
                <option>Tavolo 1</option><option>Tavolo 2</option><option>Tavolo 3</option>
                <option>Tavolo 4</option><option>Tavolo 5</option><option>Tavolo 6</option>
                <option>Tavolo 7</option><option>Tavolo 8</option><option>Tavolo 9</option><option>Tavolo 10</option>
            </select>
            <label for="numero-persone">Numero persone</label>
            <input id="numero-persone" type="number" min="1" max="30" step="1" value="1" required>
        </div>
        <div id="campo-ritiro" hidden>
            <label for="cliente-ritiro">Nome cliente</label>
            <input id="cliente-ritiro" type="text" autocomplete="name" maxlength="120">
            <label for="telefono-ritiro">Numero di telefono</label>
            <input id="telefono-ritiro" type="tel" autocomplete="tel" maxlength="30" pattern="\+?[0-9\s().-]{6,30}" title="Inserisci un numero valido.">
        </div>
        <div id="campo-banco" hidden>
            <label for="cognome-banco">Cognome cliente</label>
            <input id="cognome-banco" type="text" autocomplete="family-name" maxlength="80" placeholder="Cognome">
        </div>
        <div id="campi-consegna" class="campi-consegna" hidden>
            <div class="consegna-intestazione"><strong>Dati consegna</strong><span>Indirizzo completo e numero di telefono</span></div>
            <div class="campo-consegna campo-indirizzo">
                <label for="indirizzo-consegna">Indirizzo di consegna</label>
                <input id="indirizzo-consegna" type="text" autocomplete="street-address" maxlength="300" placeholder="Via, numero civico, città">
            </div>
            <div class="campo-consegna campo-telefono">
                <label for="telefono-consegna">Numero di telefono</label>
                <input id="telefono-consegna" type="tel" autocomplete="tel" maxlength="30" pattern="\+?[0-9\s().-]{6,30}" title="Inserisci un numero valido." placeholder="Es. 333 1234567">
            </div>
        </div>
        <div id="campo-orario" hidden>
            <label for="orario">Orario richiesto</label>
            <input id="orario" type="time" required>
        </div>
        <div id="campo-pagamento-ritiro" hidden>
            <label for="pagamento-ritiro">Pagamento ritiro</label>
            <select id="pagamento-ritiro">
                <option value="non_pagato" selected>Non pagato</option>
                <option value="pagato">Pagato</option>
            </select>
        </div>
        <div id="campo-pagamento-consegna" class="riga-pagamento-consegna" hidden>
            <div class="campo-pagamento-consegna">
                <label for="pagamento-consegna">Pagamento consegna</label>
                <select id="pagamento-consegna">
                    <option value="non_pagato" selected>Non pagato</option>
                    <option value="pagato">Pagato</option>
                    <option value="pos">POS</option>
                </select>
            </div>
            <button id="btn-costo-consegna" class="btn-costo-consegna" type="button" aria-pressed="false">Aggiungi costo consegna (+2,00 €)</button>
        </div>
    </section>
    <section class="note-input">
        <label for="note">Note</label>
        <textarea id="note" placeholder="Aggiungi una nota..."></textarea>
    </section>
    <nav class="tab-container" aria-label="Categorie">
        <button class="tab active" data-tab="pizze">Pizze</button>
        <button class="tab" data-tab="ripieni">Ripieni</button>
        <button class="tab" data-tab="panuozzi">Panuozzi</button>
        <button class="tab" data-tab="fritti">Fritti</button>
        <button class="tab" data-tab="pizze fritte">Fritte</button>
        <button class="tab" data-tab="pollo scuppettiato">Pollo</button>
        <button class="tab" data-tab="taglieri">Taglieri</button>
        <button class="tab" data-tab="primi">Primi</button>
        <button class="tab" data-tab="secondi">Secondi</button>
        <button class="tab" data-tab="bibite">Bibite</button>
        <button class="tab" data-tab="vini">Vini</button>
        <button class="tab" data-tab="dolci">Dolci</button>
    </nav>
    <div class="prodotti-wrapper">
        <section id="prodotti" class="griglia-prodotti" aria-live="polite"></section>
    </div>
    <section class="extra-section" id="extra-section">
        <h2>Extra per il prossimo piatto</h2>
        <div id="extra-lista" class="extra-carousel" aria-label="Extra disponibili"></div>
    </section>
    <section class="riepilogo">
        <h2>Riepilogo ordine</h2>
        <div class="gestione-extra-riepilogo">
            <label for="riga-extra">Prodotto da modificare</label>
            <select id="riga-extra" disabled><option value="">Seleziona un prodotto</option></select>
            <div id="extra-riepilogo" class="extra-riepilogo" hidden>
                <div id="extra-riepilogo-lista" class="extra-carousel" aria-label="Extra selezionabili"></div>
                <button id="applica-extra" type="button">Applica extra</button>
            </div>
        </div>
        <div id="riepilogo-items"><p>Nessun prodotto selezionato</p></div>
        <p id="riepilogo-totale" class="riepilogo-totale">Totale: 0,00 €</p>
    </section>
    <p id="messaggio" role="status"></p>
    <button class="btn-invia" id="btn-invia" type="button" disabled>Invia ordine in cucina</button>
    <button class="btn-annulla" id="btn-annulla" type="button">Annulla ordine</button>
</main>
<div id="conferma-modale" class="conferma-modale" hidden role="dialog" aria-modal="true" aria-labelledby="conferma-titolo">
    <div class="conferma-contenuto">
        <h2 id="conferma-titolo">Conferma ordine</h2>
        <div id="conferma-riepilogo" class="conferma-riepilogo"></div>
        <p id="conferma-totale" class="conferma-totale"></p>
        <div class="conferma-azioni"><button id="conferma-invio" type="button" class="btn-invia">Conferma</button><button id="annulla-invio" type="button" class="btn-annulla">Modifica</button></div>
    </div>
</div>
<script src="/ordini.js"></script>
<script src="/theme.js"></script>
</body>
</html>
