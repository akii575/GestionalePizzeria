<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Modifica ordine</title><style>html.auth-loading body{visibility:hidden}</style><script src="/auth-guard.js"></script><link rel="stylesheet" href="/modifica.css"><link rel="stylesheet" href="/theme.css"></head>
<body><main class="modifica"><header><a href="/gestionale.html">Torna al gestionale</a><h1>Modifica ordine <span id="numero"></span></h1></header><p id="stato"></p><label for="tipo-ordine">Tipo ordine<select id="tipo-ordine"><option value="tavolo">Servizio al tavolo</option><option value="ritiro">Ritiro al banco</option><option value="consegna">Consegna a domicilio</option></select></label><label id="destinazione-label" for="tavolo"><span>Tavolo</span><input id="tavolo" maxlength="120" required></label><div id="campi-consegna" hidden><label for="indirizzo-consegna">Indirizzo di consegna<input id="indirizzo-consegna" autocomplete="street-address" maxlength="300"></label><label for="telefono-consegna">Numero di telefono<input id="telefono-consegna" type="tel" autocomplete="tel" maxlength="30" pattern="\+?[0-9\s().-]{6,30}" title="Inserisci un numero valido."></label></div><label for="note">Note<textarea id="note" placeholder="Aggiungi una nota..."></textarea></label><section><h2>Righe ordine</h2><div id="righe"></div><p id="totale-modifica">Totale: 0,00 €</p><button id="aggiungi" type="button">Aggiungi prodotto</button></section><button id="salva" class="salva" type="button">Salva modifiche</button></main><script src="/modifica.js"></script><script src="/theme.js"></script></body></html>
