<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0F6E56">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Civico7">
    <title>Accesso | CIVICO7</title>
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
<main class="login-card">
    <div class="brand-mark" aria-hidden="true">C7</div>
    <h1>CIVICO7</h1>
    <form id="login-form">
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">Accedi</button>
    </form>
    <p id="login-status" role="status" aria-live="polite"></p>
</main>
<script src="/login.js"></script>
<script src="/theme.js"></script>
</body>
</html>
