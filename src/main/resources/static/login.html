<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso | CIVICO7</title>
    <link rel="stylesheet" href="/auth.css">
    <link rel="stylesheet" href="/theme.css">
</head>
<body>
<main class="login-card">
    <h1>CIVICO7</h1>
    <form id="login-form">
        <label for="email">Email<input id="email" name="email" type="email" autocomplete="username" required></label>
        <label for="password">Password<input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">Accedi</button>
    </form>
    <p id="login-status" role="status" aria-live="polite"></p>
</main>
<script src="/login.js"></script>
<script src="/theme.js"></script>
</body>
</html>
